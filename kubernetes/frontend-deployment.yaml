apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudwise-frontend
  namespace: cloudwise
  labels:
    app: cloudwise-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudwise-frontend
  template:
    metadata:
      labels:
        app: cloudwise-frontend
    spec:
      containers:
      - name: frontend
        image: cloudwise-frontend:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cloudwise-frontend
  namespace: cloudwise
spec:
  selector:
    app: cloudwise-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: NodePort
