apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudwise-ingress
  namespace: cloudwise
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: cloudwise.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cloudwise-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudwise-frontend
            port:
              number: 80
